<!DOCTYPE html>
<html lang="bn" dir="ltr" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#0a0f0d" />
<meta name="description" content="Panda Voice — লাইভ গ্রুপ ভয়েস চ্যাট। ১০টি মাইক সিট, রিয়েল-টাইম অডিও, গিফট আর মজার আড্ডা। 🐼" />
<title>Panda Voice 🐼 — লাইভ ভয়েস রুম</title>

<!-- Installable app -->
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="icon" type="image/png" sizes="64x64" href="icons/icon-64.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Panda Voice" />
<meta name="application-name" content="Panda Voice" />

<link rel="stylesheet" href="css/panda.css" />
</head>
<body>

<div id="boot" class="boot">
  <div class="boot-logo"><img src="icons/icon-512.png" alt="Panda Voice" /></div>
  <div class="boot-name">Panda <b>Voice</b></div>
  <div class="boot-sub">১০ সিটের লাইভ ভয়েস রুম 🐼</div>
  <div class="boot-bar"><i></i></div>
</div>

<!-- ══════════════════════════ ONBOARDING ═══════════════════════════════ -->
<section id="onboarding" class="app" hidden></section>

<!-- ══════════════════════════ AUTH ════════════════════════════════════ -->
<section id="authScreen" class="app" hidden></section>

<!-- ══════════════════════════ MAIN APP ════════════════════════════════ -->
<div id="app" class="app" hidden>

  <!-- ══════════════ HOME ══════════════ -->
  <section class="screen" data-screen="home" hidden>
    <header class="topbar">
      <div class="brandmark"><img src="icons/icon-192.png" alt="" /></div>
      <div class="topbar-title" style="font-size:17px">Panda <b style="color:var(--brand-2)">Voice</b></div>
      <div class="topbar-actions">
        <button class="coin-pill" id="homeCoins" data-nav="wallet">🎁 0</button>
        <button class="icon-btn" id="homeSearch" aria-label="Search" data-nav="discover">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4 4"/></svg>
        </button>
        <button class="icon-btn" id="homeBell" aria-label="Notifications" data-open="notifications">
          <svg viewBox="0 0 24 24"><path d="M6 9a6 6 0 1 1 12 0c0 4 1.5 5.5 1.5 5.5h-15S6 13 6 9Z"/><path d="M10 18a2 2 0 0 0 4 0"/></svg>
          <i class="dot" id="notifDot" hidden></i>
        </button>
        <button class="icon-btn" id="homeAvatar" aria-label="Profile" style="padding:2px" data-nav="profile"></button>
      </div>
    </header>

    <nav class="tabs seg" id="homeTabs" style="margin:0 14px 6px"></nav>

    <div class="screen-body" id="homeScroll">
      <div class="ptr" id="homePtr" hidden>↓ টানুন রিফ্রেশ করতে</div>
      <div id="homeOnline" class="center-note" style="padding:2px 0 10px;font-size:12px"></div>
      <div id="homeFeed"></div>
      <div class="grid-spacer"></div>
    </div>
  </section>

  <!-- ══════════════ DISCOVER ══════════════ -->
  <section class="screen" data-screen="discover" hidden>
    <header class="topbar">
      <div class="topbar-title" data-i18n="discover">ডিসকভার</div>
      <div class="topbar-actions">
        <button class="icon-btn" id="discoverCreate" aria-label="Create room">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
    </header>
    <div class="searchbar">
      <div class="input-wrap">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4 4"/></svg>
        <input id="discoverInput" type="search" placeholder="রুম, ইউজার বা আইডি খুঁজুন…" autocomplete="off" />
      </div>
    </div>
    <div class="chips" id="discoverChips"></div>
    <div class="screen-body" id="discoverScroll">
      <div id="discoverRecent"></div>
      <div id="discoverFeed"></div>
      <div class="grid-spacer"></div>
    </div>
  </section>

  <!-- ══════════════ MESSAGES ══════════════ -->
  <section class="screen" data-screen="messages" hidden>
    <header class="topbar">
      <div class="topbar-title" data-i18n="messages">মেসেজ</div>
      <div class="topbar-actions">
        <button class="icon-btn" id="msgNewChat" aria-label="New chat">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
    </header>
    <div class="screen-body" id="msgScroll"><div id="convList"></div><div class="grid-spacer"></div></div>
  </section>

  <!-- ══════════════ WALLET ══════════════ -->
  <section class="screen" data-screen="wallet" hidden>
    <header class="topbar">
      <div class="topbar-title" data-i18n="wallet">ওয়ালেট</div>
      <div class="topbar-actions">
        <button class="icon-btn" id="walletHelp" aria-label="About coins">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M12 11v6"/></svg>
        </button>
      </div>
    </header>
    <div class="screen-body" id="walletScroll"></div>
  </section>

  <!-- ══════════════ PROFILE ══════════════ -->
  <section class="screen" data-screen="profile" hidden>
    <div class="screen-body" id="profileScroll" style="padding:0 0 16px"></div>
  </section>

  <!-- ══════════════ BOTTOM NAV ══════════════ -->
  <nav class="tabbar" id="tabbar">
    <button class="tabbar-item is-active" data-go="home">
      <svg viewBox="0 0 24 24"><path d="m4 11 8-7 8 7"/><path d="M6 10v10h12V10"/></svg>
      <span>হোম</span>
    </button>
    <button class="tabbar-item" data-go="discover">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5 5-2Z"/></svg>
      <span>ডিসকভার</span>
    </button>
    <button class="tabbar-item" data-go="messages">
      <svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-8 8H7l-4 3V12a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8Z"/></svg>
      <span>মেসেজ</span><i class="dot" id="chatDot" hidden></i>
    </button>
    <button class="tabbar-item" data-go="wallet">
      <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h13v3"/><path d="M3 7v10a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1H5a2 2 0 0 1-2-2Z"/><circle cx="16.5" cy="14" r="1.2" fill="currentColor"/></svg>
      <span>ওয়ালেট</span>
    </button>
    <button class="tabbar-item" data-go="profile">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
      <span>প্রোফাইল</span>
    </button>
  </nav>

  <!-- ══════════════ VOICE ROOM (full screen) ══════════════ -->
  <div class="room" id="room" hidden>
    <div class="net-strip" id="netStrip"></div>
    <header class="room-top">
      <button class="icon-btn icon-btn--glass" id="roomBack" aria-label="Leave">
        <svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg>
      </button>
      <div class="room-head" id="roomHead"></div>
      <div class="room-top-actions" style="display:flex;gap:6px">
        <div class="room-box" id="roomBox" title="Room ID">
          <svg viewBox="0 0 24 24"><path d="M4 7h16v12H4z"/><path d="M4 7l2-3h12l2 3"/><path d="M9.5 13.5h5"/></svg>
          <span id="roomBoxText">—</span>
        </div>
        <button class="icon-btn icon-btn--glass" id="roomMore" aria-label="More">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>
        </button>
      </div>
    </header>

    <div class="room-banner" id="roomBanner"></div>

    <div class="room-scroll" id="roomScroll">
      <div class="seats" id="seats"></div>
      <div class="room-chat" id="roomChatBox">
        <div class="chat-log" id="chatLog"></div>
      </div>
      <div style="height:10px"></div>
    </div>

    <div class="reaction-bar" id="reactionBar" hidden></div>

    <div class="room-actions" id="roomActions"></div>

    <form class="room-inputbar" id="roomInputBar" hidden>
      <input id="roomInput" type="text" placeholder="কিছু লিখুন…" maxlength="500" autocomplete="off" />
      <button type="submit" class="send-btn" aria-label="Send">
        <svg viewBox="0 0 24 24"><path d="m4 12 16-8-6 16-3-6-7-2Z"/></svg>
      </button>
    </form>
  </div>

  <!-- host / members / tools sheet -->
  <div class="sheet" id="sheet" hidden>
    <div class="sheet-scrim" data-close="sheet"></div>
    <div class="sheet-panel" id="sheetPanel"></div>
  </div>

  <!-- gift sheet -->
  <div class="sheet" id="giftSheet" hidden>
    <div class="sheet-scrim" data-close="giftSheet"></div>
    <div class="sheet-panel sheet-panel--tall" id="giftPanel"></div>
  </div>

  <div class="toasts" id="toasts"></div>
  <div class="fx-layer" id="fxLayer"></div>

  <!-- Install prompt -->
  <div class="install-bar" id="installBar" hidden>
    <img class="install-icon" src="icons/icon-192.png" alt="" />
    <div class="install-text">
      <b>Panda Voice ইনস্টল করুন</b>
      <span>হোম স্ক্রিন থেকে অ্যাপের মতো ব্যবহার করুন</span>
    </div>
    <button class="btn btn--primary btn--sm" id="installBtn">Install</button>
    <button class="icon-btn" id="installClose" aria-label="Dismiss">
      <svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg>
    </button>
  </div>
</div>

<div id="pageLayer"></div>
<div class="toasts" id="pageToasts" style="z-index:200"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
