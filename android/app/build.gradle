plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mkmalik.pandavoice'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mkmalik.pandavoice'
        minSdk 23
        targetSdk 34
        versionCode 3
        versionName '1.0.2'
    }

    // rootProject is the android/ folder, so ../public is the PWA asset root.
    // These files are served locally by WebViewAssetLoader from /assets/.
    sourceSets {
        main {
            assets.srcDirs += [rootProject.file('../public')]
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
