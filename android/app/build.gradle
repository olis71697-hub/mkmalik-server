plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mkmalik.pandavoice'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mkmalik.pandavoice'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    // Package the real web app into the APK; the UI does not depend on a CDN.
    sourceSets {
        main {
            assets.srcDirs += ["$rootDir/../../public"]
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
