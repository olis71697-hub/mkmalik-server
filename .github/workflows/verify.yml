name: verify the public app

# Answers one question, from a machine that is not the sandbox and not your
# phone: does the published app actually load, and can it reach a live backend?
#
#   • purges the CDN so the newest build is served
#   • fetches the published app exactly as a browser would
#   • reads backend.json, then health-checks that backend
#
# Results are published as commit statuses, so they can be read back without
# digging through logs.

on:
  push:
    paths:
      - 'verify.trigger'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: check the published app and its backend
        env:
          R: ${{ github.repository }}
          SHA: ${{ github.sha }}
          T: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > /tmp/report.py <<'PY'
          import json, os, sys, urllib.request
          ctx, desc = sys.argv[1], sys.argv[2][:140]
          body = json.dumps({"state": "success", "context": ctx, "description": desc}).encode()
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['R']}/statuses/{os.environ['SHA']}",
              data=body, method='POST',
              headers={"Authorization": f"Bearer {os.environ['T']}",
                       "Accept": "application/vnd.github+json",
                       "Content-Type": "application/json"})
          print(ctx, "->", desc)
          urllib.request.urlopen(req).read()
          PY

          APP='https://cdn.jsdelivr.net/gh/olis71697-hub/mkmalik-server@main/public'
          HINT='https://raw.githubusercontent.com/olis71697-hub/mkmalik-server/arena/bdc831c9-mkmalik-server/backend.json'
          UA='Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1'

          echo "── purge the cdn so the newest build is served ──"
          for p in "" "index.html" "js/app.js" "js/runtime.js" "js/local.js" "sw.js" "manifest.webmanifest" "css/app.css" "icons/icon-192.png" "icons/icon-512.png" "icons/icon-maskable-512.png"; do
            curl -s -o /dev/null -w "purge $p -> %{http_code}\n" --max-time 20 "https://purge.jsdelivr.net/gh/olis71697-hub/mkmalik-server@main/public/$p" || true
          done

          echo
          echo "── the published app ──"
          HTML=$(curl -s -A "$UA" -o /tmp/page.html -w '%{http_code}/%{content_type}' --max-time 30 "$APP/" || echo 000/err)
          echo "GET $APP/  ->  $HTML"
          TITLE=$(grep -oE '<title>[^<]*' /tmp/page.html | head -1 || true)
          echo "title: $TITLE"

          JS=$(curl -s -o /dev/null -w '%{http_code}/%{content_type}' --max-time 30 "$APP/js/app.js" || echo 000/err)
          SW=$(curl -s -o /dev/null -w '%{http_code}/%{content_type}' --max-time 30 "$APP/sw.js" || echo 000/err)
          MAN=$(curl -s -o /dev/null -w '%{http_code}/%{content_type}' --max-time 30 "$APP/manifest.webmanifest" || echo 000/err)
          ICON=$(curl -s -o /dev/null -w '%{http_code}/%{content_type}' --max-time 30 "$APP/icons/icon-192.png" || echo 000/err)
          CSS=$(curl -s -o /dev/null -w '%{http_code}/%{content_type}' --max-time 30 "$APP/css/app.css" || echo 000/err)
          echo "app.js      $JS"
          echo "sw.js       $SW"
          echo "manifest    $MAN"
          echo "icon        $ICON"
          echo "css         $CSS"

          # does the served app actually contain the backend-discovery code?
          RUNTIME=$(curl -s --max-time 30 "$APP/js/runtime.js" || echo '')
          if echo "$RUNTIME" | grep -q 'BACKEND_HINT_URLS'; then DISC="discovery=yes"; else DISC="discovery=NO"; fi
          echo "$DISC"

          python3 /tmp/report.py public-app-html "$APP/ $HTML ${TITLE:-no-title}"
          python3 /tmp/report.py public-app-assets "js=$JS sw=$SW man=$MAN icon=$ICON css=$CSS $DISC"

          echo
          echo "── the advertised backend ──"
          HINTTXT=$(curl -s --max-time 30 "$HINT" || true)
          echo "backend.json: $HINTTXT"
          BACKEND=$(printf '%s' "$HINTTXT" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("backend",""))' 2>/dev/null || echo '')
          echo "backend: ${BACKEND:-none}"

          if [ -n "$BACKEND" ]; then
            HC=$(curl -s -o /tmp/health.json -w '%{http_code}' --max-time 30 "$BACKEND/api/health" || echo 000)
            echo "health -> $HC  $(head -c 160 /tmp/health.json)"
            ROOMS=$(curl -s --max-time 30 "$BACKEND/api/rooms" | head -c 200)
            echo "rooms  -> $ROOMS"
            python3 /tmp/report.py live-backend "health=$HC $(head -c 90 /tmp/health.json)"
          else
            python3 /tmp/report.py live-backend "no backend advertised yet"
          fi
