name: deploy static app to GitHub Pages

on:
  push:
    branches:
      - main
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Auto-enable Pages (build type: workflow) if it is not on yet.
      - name: configure pages
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - name: assemble static site
        run: |
          set -e
          echo "publishing public/ as the static app"
          du -sh public
          find public -type f | sort

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
