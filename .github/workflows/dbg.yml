name: debug pages permissions
on: [push, workflow_dispatch]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: what can this token see
        env:
          T: ${{ secrets.GITHUB_TOKEN }}
          R: ${{ github.repository }}
        run: |
          echo "---- GET /repos/$R ----"
          curl -sS -o /tmp/r1 -w '%{http_code}\n' -H "Authorization: Bearer $T" \
            -H "Accept: application/vnd.github+json" https://api.github.com/repos/$R
          python3 -c "import json;d=json.load(open('/tmp/r1'));print({k:d.get(k) for k in ['full_name','private','visibility','has_pages','default_branch','permissions']})"

          echo "---- token permissions ----"
          curl -sS -D /tmp/h1 -o /tmp/r2 -H "Authorization: Bearer $T" https://api.github.com/repos/$R/pages
          grep -i '^x-accepted\|^x-oauth\|^status' /tmp/h1 || true
          head -c 400 /tmp/r2; echo

          echo "---- GET /actions/permissions ----"
          curl -sS -w ' [%{http_code}]\n' -H "Authorization: Bearer $T" https://api.github.com/repos/$R/actions/permissions

          echo "---- POST /pages build_type=workflow ----"
          curl -sS -w ' [%{http_code}]\n' -X POST -H "Authorization: Bearer $T" \
            -H "Accept: application/vnd.github+json" \
            -d '{"build_type":"workflow"}' https://api.github.com/repos/$R/pages

          echo "---- POST /pages source=main ----"
          curl -sS -w ' [%{http_code}]\n' -X POST -H "Authorization: Bearer $T" \
            -H "Accept: application/vnd.github+json" \
            -d '{"source":{"branch":"main","path":"/"}}' https://api.github.com/repos/$R/pages

          echo "---- outbound internet probe ----"
          for u in https://surge.sh https://api.netlify.com/api/v1 https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64; do
            printf '%-70s' "$u"
            curl -sS -o /dev/null -w '%{http_code}\n' --max-time 15 "$u" || echo unreachable
          done
