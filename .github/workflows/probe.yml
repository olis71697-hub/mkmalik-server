name: probe stable tunnels

on:
  push:
    paths:
      - 'probe.trigger'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: tiny local server
        run: |
          mkdir -p /tmp/site && echo 'MK-MALIK-PROBE-OK' > /tmp/site/index.html
          (cd /tmp/site && nohup python3 -m http.server 9911 > /tmp/probe-server.log 2>&1 &)
          sleep 2
          curl -sf http://127.0.0.1:9911/

      - name: browser-shaped visit to a fixed localtunnel subdomain
        env:
          R: ${{ github.repository }}
          SHA: ${{ github.sha }}
          T: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > /tmp/report.py <<'PY'
          import json, os, sys, urllib.request
          ctx, desc = sys.argv[1], sys.argv[2][:140]
          body = json.dumps({"state": "success", "context": ctx, "description": desc}).encode()
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['R']}/statuses/{os.environ['SHA']}",
              data=body, method='POST',
              headers={"Authorization": f"Bearer {os.environ['T']}",
                       "Accept": "application/vnd.github+json",
                       "Content-Type": "application/json"})
          print(ctx, "->", desc)
          urllib.request.urlopen(req).read()
          PY

          npx --yes localtunnel --port 9911 --subdomain mkmalik-live > /tmp/lt.log 2>&1 &
          URL=""
          for i in $(seq 1 20); do
            URL=$(grep -oE 'https://[a-z0-9.-]+\.loca\.lt' /tmp/lt.log 2>/dev/null | head -1 || true)
            [ -n "$URL" ] && break
            sleep 2
          done
          echo "--- localtunnel log ---"; cat /tmp/lt.log
          if [ -z "$URL" ]; then python3 /tmp/report.py probe-lt "FAIL $(tail -c 100 /tmp/lt.log | tr '\n' ' ')"; exit 0; fi
          echo "URL=$URL"
          sleep 8

          UA='Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1'
          CODE=$(curl -s -o /tmp/browser.html -w '%{http_code}' -A "$UA" \
                 -H 'Accept: text/html,application/xhtml+xml' --max-time 25 "$URL/" || echo 000)
          echo "browser-shaped GET / -> $CODE, $(wc -c < /tmp/browser.html) bytes"
          head -c 500 /tmp/browser.html; echo

          if grep -qiE 'tunnel reminder|click to continue|tunnel password|bypass-tunnel' /tmp/browser.html; then
            VERDICT="interstitial"
          elif grep -q 'MK-MALIK-PROBE-OK' /tmp/browser.html; then
            VERDICT="clean-for-browsers"
          else
            VERDICT="unknown"
          fi

          BYPASS=$(curl -s -o /tmp/bypass.txt -w '%{http_code}' -A "$UA" \
                   -H 'bypass-tunnel-reminder: 1' --max-time 25 "$URL/" || echo 000)

          echo "verdict=$VERDICT code=$CODE bypass=$BYPASS"
          python3 /tmp/report.py probe-lt "$URL $VERDICT code=$CODE bypass=$BYPASS"

      - name: cloudflared quick tunnel · browser test
        env:
          R: ${{ github.repository }}
          SHA: ${{ github.sha }}
          T: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sSL --retry 3 --max-time 120 -o /tmp/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared
          nohup /tmp/cloudflared tunnel --url http://127.0.0.1:9911 --no-autoupdate > /tmp/cf.log 2>&1 &
          URL=""
          for i in $(seq 1 30); do
            URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cf.log 2>/dev/null | head -1 || true)
            [ -n "$URL" ] && break
            sleep 2
          done
          if [ -z "$URL" ]; then python3 /tmp/report.py probe-cf "FAIL $(tail -c 100 /tmp/cf.log | tr '\n' ' ')"; exit 0; fi
          sleep 6
          UA='Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1'
          CODE=$(curl -s -o /tmp/cf.html -w '%{http_code}' -A "$UA" --max-time 25 "$URL/" || echo 000)
          echo "browser-shaped GET / -> $CODE, $(wc -c < /tmp/cf.html) bytes"
          head -c 300 /tmp/cf.html; echo
          if grep -q 'MK-MALIK-PROBE-OK' /tmp/cf.html; then V="clean-for-browsers"; else V="check"; fi
          python3 /tmp/report.py probe-cf "$URL $V code=$CODE"
