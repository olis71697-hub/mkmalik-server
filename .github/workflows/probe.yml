name: probe stable tunnels

on:
  push:
    paths:
      - 'probe.trigger'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: does a github cdn serve the app properly
        env:
          R: ${{ github.repository }}
          SHA: ${{ github.sha }}
          T: ${{ secrets.GITHUB_TOKEN }}
          OWNER: olis71697-hub
          REPO: mkmalik-server
        run: |
          cat > /tmp/report.py <<'PY'
          import json, os, sys, urllib.request
          ctx, desc = sys.argv[1], sys.argv[2][:140]
          body = json.dumps({"state": "success", "context": ctx, "description": desc}).encode()
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['R']}/statuses/{os.environ['SHA']}",
              data=body, method='POST',
              headers={"Authorization": f"Bearer {os.environ['T']}",
                       "Accept": "application/vnd.github+json",
                       "Content-Type": "application/json"})
          print(ctx, "->", desc)
          urllib.request.urlopen(req).read()
          PY

          UA='Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1'

          probe () { # probe <label> <base-url>   (base ends with /)
            local label="$1" base="$2"
            local hc js sw man icon
            hc=$(curl -s -o /tmp/h -w '%{http_code}/%{content_type}' -A "$UA" --max-time 25 "$base" || echo 000/err)
            echo "[$label] index.html -> $hc  :: $(head -c 80 /tmp/h | tr -d '\n')"
            js=$(curl -s -o /tmp/j -w '%{http_code}/%{content_type}' --max-time 25 "$base""js/app.js" || echo 000/err)
            echo "[$label] js/app.js  -> $js"
            sw=$(curl -s -o /dev/null -w '%{http_code}/%{content_type}' --max-time 25 "$base""sw.js" || echo 000/err)
            echo "[$label] sw.js      -> $sw"
            man=$(curl -s -o /dev/null -w '%{http_code}/%{content_type}' --max-time 25 "$base""manifest.webmanifest" || echo 000/err)
            icon=$(curl -s -o /dev/null -w '%{http_code}/%{content_type}' --max-time 25 "$base""icons/icon-192.png" || echo 000/err)
            echo "[$label] manifest   -> $man   icon -> $icon"
            python3 /tmp/report.py "cdn-$label" "$base html=$hc js=$js sw=$sw man=$man icon=$icon"
          }

          echo "=============== jsdelivr (sha) ==============="
          probe jsdelivr-sha "https://cdn.jsdelivr.net/gh/$OWNER/$REPO@$SHA/public/"
          echo "=============== raw.githack (sha) ==============="
          probe githack "https://raw.githack.com/$OWNER/$REPO/$SHA/public/"
          echo "=============== statically.io (sha) ==============="
          probe statically "https://cdn.statically.io/gh/$OWNER/$REPO/$SHA/public/"
