name: probe stable tunnels

on:
  push:
    paths:
      - 'probe.trigger'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: does a github cdn serve the app properly
        env:
          R: ${{ github.repository }}
          SHA: ${{ github.sha }}
          T: ${{ secrets.GITHUB_TOKEN }}
          OWNER: olis71697-hub
          REPO: mkmalik-server
        run: |
          cat > /tmp/report.py <<'PY'
          import json, os, sys, urllib.request
          ctx, desc = sys.argv[1], sys.argv[2][:140]
          body = json.dumps({"state": "success", "context": ctx, "description": desc}).encode()
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['R']}/statuses/{os.environ['SHA']}",
              data=body, method='POST',
              headers={"Authorization": f"Bearer {os.environ['T']}",
                       "Accept": "application/vnd.github+json",
                       "Content-Type": "application/json"})
          print(ctx, "->", desc)
          urllib.request.urlopen(req).read()
          PY

          UA='Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1'

          # one commit status per check: descriptions are capped at 140 chars
          probe () { # probe <label> <base-url>
            local label="$1" base="$2"
            local js sw man icon css
            js=$(curl -s -o /dev/null -w '%{http_code}/%{content_type}' --max-time 25 "$base""js/app.js" || echo 000/err)
            sw=$(curl -s -o /dev/null -w '%{http_code}/%{content_type}' --max-time 25 "$base""sw.js" || echo 000/err)
            man=$(curl -s -o /dev/null -w '%{http_code}/%{content_type}' --max-time 25 "$base""manifest.webmanifest" || echo 000/err)
            icon=$(curl -s -o /dev/null -w '%{http_code}/%{content_type}' --max-time 25 "$base""icons/icon-192.png" || echo 000/err)
            css=$(curl -s -o /dev/null -w '%{http_code}/%{content_type}' --max-time 25 "$base""css/app.css" || echo 000/err)
            python3 /tmp/report.py "cdn-$label-js"  "app.js=$js sw=$sw css=$css"
            python3 /tmp/report.py "cdn-$label-meta" "manifest=$man icon=$icon"
          }

          UA='Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1'

          JS_BASE="https://cdn.jsdelivr.net/gh/$OWNER/$REPO@$SHA/public/"
          echo "=============== jsdelivr ==============="
          curl -s -o /tmp/h -w 'html %{http_code}/%{content_type}\n' -A "$UA" --max-time 25 "$JS_BASE"
          grep -o '<title>[^<]*' /tmp/h || echo "!! no title"
          grep -c 'installBar' /tmp/h || true
          probe jsdelivr "$JS_BASE"

          echo "=============== raw.githack ==============="
          GH_BASE="https://raw.githack.com/$OWNER/$REPO/$SHA/public/"
          curl -s -o /tmp/h2 -w 'html %{http_code}/%{content_type}\n' -A "$UA" --max-time 25 "$GH_BASE"
          grep -o '<title>[^<]*' /tmp/h2 || echo "!! no title"
          probe githack "$GH_BASE"
