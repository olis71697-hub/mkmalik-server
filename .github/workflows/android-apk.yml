name: Build Panda Voice Android APK

on:
  push:
    branches:
      - 'arena/e4891164-mkmalik-server'
    paths:
      - 'android/**'
      - 'public/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out app
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable APK
        run: gradle --no-daemon -p android :app:assembleDebug

      - name: Verify APK was created
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK for download
        uses: actions/upload-artifact@v4
        with:
          name: Panda-Voice-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
